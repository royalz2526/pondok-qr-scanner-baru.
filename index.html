<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pemindai QR Pondok</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#18352b;font-family:Arial,sans-serif}main{max-width:620px;margin:0 auto;padding:22px}.card{background:#fff;border:1px solid #e1eae4;border-radius:16px;padding:20px;box-shadow:0 8px 30px #153b2510}h1{font-size:21px;margin:0 0 8px;color:#14532d}p{font-size:14px;line-height:1.55;color:#617168}button{border:0;border-radius:9px;padding:12px 16px;font-weight:bold;background:#17643b;color:white;font-size:14px}button.secondary{background:#e8f1eb;color:#14532d}button:disabled{opacity:.55}.camera-frame{width:100%;max-width:420px;aspect-ratio:1/1;margin:14px auto 0;background:#111;border-radius:12px;overflow:hidden}.camera-frame video{width:100%;height:100%;display:block;object-fit:cover;background:#111}#status{padding:12px;border-radius:9px;background:#eef6f0;margin-top:14px;font-size:14px;line-height:1.5;white-space:pre-wrap}.err{background:#fff0f0!important;color:#9b1c1c}.ok{background:#e8f7ed!important;color:#166534}.small{font-size:12px;color:#718078}</style></head>
<body><main><section class="card"><h1>Pemindai QR Pondok</h1><p>Kamera akan tetap aktif. Setiap hasil scan diproses aplikasi, lalu terdengar beep jika berhasil atau bunyi berbeda jika gagal.</p><button id="start">Mulai Kamera</button> <button id="stop" class="secondary" disabled>Matikan Kamera</button><div class="camera-frame"><video id="video" autoplay muted playsinline></video></div><canvas id="canvas" hidden></canvas><div id="status">Siap. Tekan “Mulai Kamera”.</div><p class="small">Buka halaman ini melalui tombol Buka Kamera QR di aplikasi Administrasi Pondok.</p></section></main>
<script>
(function(){
 const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
 const status=document.getElementById('status'),start=document.getElementById('start'),stop=document.getElementById('stop');
 let stream=null,raf=0,busy=false,lastPayload='',lastAt=0,audioCtx=null;
 function msg(t,kind){status.textContent=t;status.className=kind||'';}
 function beep(ok){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=ok?880:240;g.gain.value=.10;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+(ok?.13:.28));if(navigator.vibrate)navigator.vibrate(ok?55:[80,55,80]);}catch(e){}}
 async function mulai(){
  if(!window.opener){msg('Buka pemindai melalui tombol Buka Kamera QR di aplikasi Administrasi Pondok.','err');return;}
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('Akses kamera tidak tersedia. Gunakan Chrome terbaru melalui HTTPS.','err');return;}
  if(typeof jsQR!=='function'){msg('Library pembaca QR gagal dimuat. Periksa internet lalu muat ulang.','err');return;}
  start.disabled=true;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();stop.disabled=false;msg('Kamera aktif. Arahkan QR santri. Kamera akan tetap menyala setelah scan.');raf=requestAnimationFrame(pindai);}
  catch(e){start.disabled=false;let m='Kamera gagal dibuka ('+(e&&e.name||'Error')+').';if(e.name==='NotAllowedError'||e.name==='PermissionDeniedError')m+=' Izinkan akses kamera pada pengaturan browser.';else if(e.name==='NotFoundError')m+=' Kamera tidak ditemukan.';else if(e.name==='NotReadableError')m+=' Kamera sedang digunakan aplikasi lain.';msg(m,'err');}
 }
 function pindai(){if(!stream)return;if(video.readyState>=2&&!busy&&video.videoWidth){const scale=Math.min(1,1200/video.videoWidth);canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));ctx.drawImage(video,0,0,canvas.width,canvas.height);const im=ctx.getImageData(0,0,canvas.width,canvas.height);const r=jsQR(im.data,im.width,im.height,{inversionAttempts:'attemptBoth'});const now=Date.now();if(r&&r.data&&(r.data!==lastPayload||now-lastAt>1800)){lastPayload=r.data;lastAt=now;busy=true;msg('QR terbaca. Menunggu konfirmasi aplikasi...');try{window.opener.postMessage({type:'PONDOK_QR_SCAN',payload:r.data},'*');}catch(e){busy=false;beep(false);msg('Gagal mengirim QR ke aplikasi.','err');}}}raf=requestAnimationFrame(pindai);}
 window.addEventListener('message',function(e){if(e.source!==window.opener)return;const d=e.data||{};if(d.type!=='PONDOK_QR_RESULT')return;busy=false;beep(!!d.ok);msg(d.ok?'BERHASIL: '+(d.message||'Kehadiran tercatat.'):'GAGAL: '+(d.message||'QR tidak berhasil diproses.'),d.ok?'ok':'err');});
 function hentikan(){if(raf)cancelAnimationFrame(raf);raf=0;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;start.disabled=false;stop.disabled=true;msg('Kamera dimatikan.');}
 start.addEventListener('click',mulai);stop.addEventListener('click',hentikan);window.addEventListener('beforeunload',hentikan);
})();
</script></body></html>
